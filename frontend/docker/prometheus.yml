global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: bid-gateway
    static_configs:
      - targets: ["bid-gateway:8090"]
  - job_name: campaign-service
    static_configs:
      - targets: ["campaign-service:8091"]
  - job_name: event-aggregator
    static_configs:
      - targets: ["event-aggregator:8093"]
  - job_name: mock-bidders
    static_configs:
      - targets:
          [
            "mock-bidders:9101",
            "mock-bidders:9102",
            "mock-bidders:9103",
            "mock-bidders:9104",
            "mock-bidders:9105",
            "mock-bidders:9106",
            "mock-bidders:9107",
            "mock-bidders:9108",
            "mock-bidders:8094",
          ]
