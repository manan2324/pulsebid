        - "contact_email"
        - "status"
        - "created_at"
        - "updated_at"
    "AdvertiserPage":
      "type": "object"
      "additionalProperties": false
      "properties":
        "data":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Advertiser"
