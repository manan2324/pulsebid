    "Targeting":
      "type": "object"
      "additionalProperties": false
      "properties":
        "campaign_id":
          "type": "string"
          "format": "uuid"
        "countries":
          "type": "array"
          "items":
            "type": "string"
            "pattern": "^[A-Za-z]{2}$"
          "default": []
          "description": "ISO alpha-2 codes, normalized to uppercase and deduplicated."
        "device_types":
          "type": "array"
          "items":
            "type": "string"
            "enum":
              - "mobile"
              - "desktop"
              - "tablet"
              - "ctv"
          "default": []
        "placement_ids":
          "type": "array"
          "items":
            "type": "string"
            "minLength": 1
          "default": []
        "hours_of_day":
          "type": "array"
          "items":
            "type": "integer"
            "minimum": 0
            "maximum": 23
          "default": []
          "description": "Sorted and deduplicated."
        "timezone":
          "type": "string"
          "default": "UTC"
          "description": "IANA timezone; Local is not accepted."
        "updated_at":
          "type": "string"
          "format": "date-time"
      "required":
        - "campaign_id"
        - "countries"
        - "device_types"
        - "placement_ids"
        - "hours_of_day"
        - "timezone"
        - "updated_at"
