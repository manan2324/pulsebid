      "parameters":
        -
          "name": "limit"
          "in": "query"
          "schema":
            "type": "integer"
            "default": 50
            "minimum": 1
            "maximum": 200
        -
          "name": "cursor"
          "in": "query"
          "schema":
            "type": "string"
          "description": "Opaque keyset cursor bound to the resource and filters. Keep the same filters for subsequent pages."
    "post":
      "operationId": "createAdvertiser"
      "description": "Create a advertiser."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AdvertiserCreate"
      "responses":
        "201":
          "description": "Success"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Advertiser"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "413":
