        "timeout_ms":
          "type": "integer"
          "minimum": 10
          "maximum": 1000
          "nullable": true
        "enabled":
          "type": "boolean"
          "default": true
        "created_at":
          "type": "string"
          "format": "date-time"
        "updated_at":
          "type": "string"
          "format": "date-time"
      "required":
        - "id"
        - "name"
        - "endpoint_url"
        - "timeout_ms"
        - "enabled"
        - "created_at"
        - "updated_at"
    "BidderPage":
      "type": "object"
      "additionalProperties": false
      "properties":
        "data":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Bidder"
        "next_cursor":
          "type": "string"
          "nullable": true
      "required":
        - "data"
        - "next_cursor"
    "BudgetView":
