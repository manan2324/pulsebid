          "type": "string"
          "minLength": 1
          "maxLength": 200
        "format":
          "type": "string"
          "enum":
            - "banner"
            - "native"
            - "video"
        "width":
          "type": "integer"
          "minimum": 1
          "nullable": true
        "height":
          "type": "integer"
          "minimum": 1
          "nullable": true
        "markup":
          "type": "string"
          "minLength": 1
          "description": "At most 65536 UTF-8 bytes."
        "landing_url":
          "type": "string"
          "format": "uri"
          "pattern": "^https?://"
        "status":
          "type": "string"
          "enum":
