"components":
  "securitySchemes":
    "APIKey":
      "type": "apiKey"
      "in": "header"
      "name": "X-API-Key"
  "responses":
    "Error400":
      "description": "Invalid input"
      "headers":
        "X-Request-Id":
          "schema":
            "type": "string"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorEnvelope"
    "Error401":
      "description": "Missing or invalid X-API-Key"
      "headers":
        "X-Request-Id":
          "schema":
            "type": "string"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorEnvelope"
    "Error404":
      "description": "Resource or route not found"
      "headers":
        "X-Request-Id":
          "schema":
            "type": "string"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorEnvelope"
    "Error409":
      "description": "Unique/FK conflict or invalid campaign transition"
      "headers":
        "X-Request-Id":
          "schema":
            "type": "string"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorEnvelope"
    "Error413":
      "description": "Body exceeds 512 KiB"
      "headers":
        "X-Request-Id":
          "schema":
            "type": "string"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorEnvelope"
    "Error415":
      "description": "Content-Type must be application/json"
      "headers":
        "X-Request-Id":
          "schema":
            "type": "string"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorEnvelope"
    "Error500":
      "description": "Internal error"
      "headers":
        "X-Request-Id":
          "schema":
            "type": "string"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorEnvelope"
    "Error503":
      "description": "Database unavailable"
      "headers":
        "X-Request-Id":
          "schema":
            "type": "string"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorEnvelope"
  "schemas":
    "CatalogSnapshot":
      "type": "object"
      "required": ["version", "unchanged", "bidders", "campaigns", "generated_at"]
      "properties":
        "version":
          "type": "string"
          "pattern": "^[0-9]+$"
          "description": "Exact protobuf int64 catalog version."
        "unchanged":
          "type": "boolean"
          "enum": [false]
        "generated_at":
          "type": "string"
          "format": "date-time"
        "bidders":
          "type": "array"
          "items":
            "type": "object"
            "required": ["id", "endpoint_url", "timeout_ms"]
            "properties":
              "id": {"type": "string"}
              "endpoint_url": {"type": "string", "format": "uri"}
              "timeout_ms": {"type": "integer", "description": "0 means gateway default."}
        "campaigns":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CatalogCampaign"
    "CatalogCampaign":
      "type": "object"
      "required": ["id", "advertiser_id", "bidder_id", "name", "daily_budget_micros", "max_bid_cpm_micros", "pacing_mode", "targeting", "creatives"]
      "properties":
        "id": {"type": "string", "format": "uuid"}
        "advertiser_id": {"type": "string", "format": "uuid"}
        "bidder_id": {"type": "string"}
        "name": {"type": "string"}
        "daily_budget_micros": {"type": "string", "pattern": "^[0-9]+$"}
        "max_bid_cpm_micros": {"type": "string", "pattern": "^[0-9]+$"}
        "pacing_mode":
          "type": "string"
          "enum": ["PACING_MODE_ASAP", "PACING_MODE_EVEN"]
        "start_at": {"type": "string", "format": "date-time", "description": "Omitted when unset."}
        "end_at": {"type": "string", "format": "date-time", "description": "Omitted when unset."}
        "targeting":
          "type": "object"
          "properties":
            "countries": {"type": "array", "items": {"type": "string"}}
            "device_types": {"type": "array", "items": {"type": "string"}}
            "placement_ids": {"type": "array", "items": {"type": "string"}}
            "hours_of_day": {"type": "array", "items": {"type": "integer", "minimum": 0, "maximum": 23}}
            "timezone": {"type": "string"}
        "creatives":
          "type": "array"
          "description": "Active creatives ordered by ID."
          "items":
            "type": "object"
            "properties":
              "id": {"type": "string", "format": "uuid"}
              "format": {"type": "string"}
              "width": {"type": "integer", "description": "0 when unspecified."}
              "height": {"type": "integer", "description": "0 when unspecified."}
              "markup": {"type": "string"}
              "landing_url": {"type": "string", "format": "uri"}
    "AdvertiserCreate":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "contact_email":
          "type": "string"
          "format": "email"
          "nullable": true
      "required":
        - "name"
    "AdvertiserPatch":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "contact_email":
          "type": "string"
          "format": "email"
          "nullable": true
        "status":
          "type": "string"
          "enum":
            - "active"
            - "archived"
    "BidderCreate":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "pattern": "^[a-z0-9][a-z0-9-]{1,62}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "endpoint_url":
          "type": "string"
          "format": "uri"
          "pattern": "^https?://"
        "timeout_ms":
          "type": "integer"
          "minimum": 10
          "maximum": 1000
          "nullable": true
        "enabled":
          "type": "boolean"
          "default": true
      "required":
        - "id"
        - "name"
        - "endpoint_url"
    "BidderPatch":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "endpoint_url":
          "type": "string"
          "format": "uri"
          "pattern": "^https?://"
        "timeout_ms":
          "type": "integer"
          "minimum": 10
          "maximum": 1000
          "nullable": true
        "enabled":
          "type": "boolean"
          "default": true
    "CampaignCreate":
      "type": "object"
      "additionalProperties": false
      "properties":
        "advertiser_id":
          "type": "string"
          "format": "uuid"
        "bidder_id":
          "type": "string"
          "pattern": "^[a-z0-9][a-z0-9-]{1,62}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "daily_budget":
          "oneOf":
            -
              "type": "number"
              "exclusiveMinimum": true
              "minimum": 0
              "multipleOf": 0.000001
            -
              "type": "string"
              "description": "Exact positive decimal, at most six fractional places; exponent notation is accepted when exactly representable."
          "description": "USD; > 0 and <= 1000000."
        "max_bid_cpm":
          "oneOf":
            -
              "type": "number"
              "exclusiveMinimum": true
              "minimum": 0
              "multipleOf": 0.000001
            -
              "type": "string"
              "description": "Exact positive decimal, at most six fractional places; exponent notation is accepted when exactly representable."
          "description": "USD CPM; > 0 and <= 1000."
        "pacing_mode":
          "type": "string"
          "enum":
            - "asap"
            - "even"
          "default": "even"
        "start_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "end_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
      "required":
        - "advertiser_id"
        - "bidder_id"
        - "name"
        - "daily_budget"
        - "max_bid_cpm"
    "CampaignPatch":
      "type": "object"
      "additionalProperties": false
      "properties":
        "advertiser_id":
          "type": "string"
          "format": "uuid"
        "bidder_id":
          "type": "string"
          "pattern": "^[a-z0-9][a-z0-9-]{1,62}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "status":
          "type": "string"
          "enum":
            - "draft"
            - "active"
            - "paused"
            - "archived"
        "daily_budget":
          "oneOf":
            -
              "type": "number"
              "exclusiveMinimum": true
              "minimum": 0
              "multipleOf": 0.000001
            -
              "type": "string"
              "description": "Exact positive decimal, at most six fractional places; exponent notation is accepted when exactly representable."
          "description": "USD; > 0 and <= 1000000."
        "max_bid_cpm":
          "oneOf":
            -
              "type": "number"
              "exclusiveMinimum": true
              "minimum": 0
              "multipleOf": 0.000001
            -
              "type": "string"
              "description": "Exact positive decimal, at most six fractional places; exponent notation is accepted when exactly representable."
          "description": "USD CPM; > 0 and <= 1000."
        "pacing_mode":
          "type": "string"
          "enum":
            - "asap"
            - "even"
          "default": "even"
        "start_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "end_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
    "CreativeCreate":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "format":
          "type": "string"
          "enum":
            - "banner"
            - "native"
            - "video"
        "width":
          "type": "integer"
          "minimum": 1
          "nullable": true
        "height":
          "type": "integer"
          "minimum": 1
          "nullable": true
        "markup":
          "type": "string"
          "minLength": 1
          "description": "At most 65536 UTF-8 bytes."
        "landing_url":
          "type": "string"
          "format": "uri"
          "pattern": "^https?://"
        "status":
          "type": "string"
          "enum":
            - "active"
            - "paused"
          "default": "active"
      "required":
        - "name"
        - "format"
        - "markup"
        - "landing_url"
    "CreativePatch":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "format":
          "type": "string"
          "enum":
            - "banner"
            - "native"
            - "video"
        "width":
          "type": "integer"
          "minimum": 1
          "nullable": true
        "height":
          "type": "integer"
          "minimum": 1
          "nullable": true
        "markup":
          "type": "string"
          "minLength": 1
          "description": "At most 65536 UTF-8 bytes."
        "landing_url":
          "type": "string"
          "format": "uri"
          "pattern": "^https?://"
        "status":
          "type": "string"
          "enum":
            - "active"
            - "paused"
          "default": "active"
    "TargetingPut":
      "type": "object"
      "additionalProperties": false
      "properties":
        "countries":
          "type": "array"
          "items":
            "type": "string"
            "pattern": "^[A-Za-z]{2}$"
          "default": []
          "description": "ISO alpha-2 codes, normalized to uppercase and deduplicated."
        "device_types":
          "type": "array"
          "items":
            "type": "string"
            "enum":
              - "mobile"
              - "desktop"
              - "tablet"
              - "ctv"
          "default": []
        "placement_ids":
          "type": "array"
          "items":
            "type": "string"
            "minLength": 1
          "default": []
        "hours_of_day":
          "type": "array"
          "items":
            "type": "integer"
            "minimum": 0
            "maximum": 23
          "default": []
          "description": "Sorted and deduplicated."
        "timezone":
          "type": "string"
          "default": "UTC"
          "description": "IANA timezone; Local is not accepted."
