global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: bid-gateway
    static_configs:
      - targets: ["host.docker.internal:8090"]
  - job_name: campaign-service
    static_configs:
      - targets: ["host.docker.internal:8091"]
  - job_name: event-aggregator
    static_configs:
      - targets: ["host.docker.internal:8093"]
  - job_name: mock-bidders
    static_configs:
      - targets:
          - "host.docker.internal:9101"
          - "host.docker.internal:9102"
          - "host.docker.internal:9103"
          - "host.docker.internal:9104"
          - "host.docker.internal:9105"
          - "host.docker.internal:9106"
          - "host.docker.internal:9107"
          - "host.docker.internal:9108"
          - "host.docker.internal:8094"
