groups:
  - name: pulsebid-alerts
    rules:
      - alert: BidLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(bid_duration_seconds_bucket[5m])) by (le)) > 0.12
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Bid gateway p99 latency exceeds 120ms threshold"
          description: "Gateway p99 bid latency is {{ $value }}s (> 120ms) for over 5 minutes."

      - alert: FillRateLow
        expr: sum(rate(bid_requests_total{outcome="filled"}[10m])) / sum(rate(bid_requests_total[10m])) < 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Exchange fill rate is below 20%"
          description: "Exchange fill rate has dropped to {{ $value | humanizePercentage }} for over 10 minutes."

      - alert: SnapshotStale
        expr: snapshot_age_seconds > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Gateway catalog snapshot is stale"
          description: "Catalog snapshot age on gateway is {{ $value }}s (> 30s)."

      - alert: ConsumerLagHigh
        expr: sum(aggregator_consumer_lag) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka event aggregator consumer lag is elevated"
          description: "Total event consumer lag across partitions is {{ $value }} (> 100) for over 5 minutes."
